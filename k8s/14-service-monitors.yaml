---
# =============================================================================
# POSTGRES EXPORTER (Optional but recommended)
# =============================================================================
# Exports PostgreSQL metrics to Prometheus
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-exporter-config
  namespace: ecommerce
data:
  queries.yaml: |
    pg_database:
      query: "SELECT pg_database.datname, pg_database_size(pg_database.datname) as size FROM pg_database"
      master: true
      metrics:
        - datname:
            usage: "LABEL"
            description: "Name of the database"
        - size:
            usage: "GAUGE"
            description: "Database size in bytes"
    
    pg_stat_user_tables:
      query: "SELECT schemaname, relname, seq_scan, idx_scan, n_tup_ins, n_tup_upd, n_tup_del FROM pg_stat_user_tables"
      metrics:
        - schemaname:
            usage: "LABEL"
            description: "Name of the schema"
        - relname:
            usage: "LABEL"
            description: "Name of the table"
        - seq_scan:
            usage: "COUNTER"
            description: "Number of sequential scans"
        - idx_scan:
            usage: "COUNTER"
            description: "Number of index scans"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: ecommerce
  labels:
    app: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
    spec:
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.13.2
          env:
            - name: DATA_SOURCE_NAME
              value: "postgresql://postgres:postgres@postgres:5432/ecommerce_db?sslmode=disable"
            # Use secret in production:
            # valueFrom:
            #   secretKeyRef:
            #     name: postgres-credentials
            #     key: connection-string
          ports:
            - name: metrics
              containerPort: 9187
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: queries
              mountPath: /etc/postgres-exporter
      volumes:
        - name: queries
          configMap:
            name: postgres-exporter-config

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: ecommerce
  labels:
    app: postgres-exporter
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187
  selector:
    app: postgres-exporter

---
# =============================================================================
# REDIS EXPORTER (Optional but recommended)
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: ecommerce
  labels:
    app: redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
    spec:
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.53.0
          env:
            - name: REDIS_ADDR
              value: "redis:6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: redis-password
          ports:
            - name: metrics
              containerPort: 9121
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: ecommerce
  labels:
    app: redis-exporter
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9121"
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9121
      targetPort: 9121
  selector:
    app: redis-exporter

---
# =============================================================================
# KEY METRICS TO MONITOR FOR E-COMMERCE
# =============================================================================
#
# Application Performance:
# - Request rate (requests/sec)
# - Response time (p50, p95, p99)
# - Error rate (4xx, 5xx errors)
# - Active users/sessions
#
# Business Metrics:
# - Product views per minute
# - Cart additions per minute
# - Order completion rate
# - Revenue per hour
# - Failed transactions
# - Abandoned carts
#
# Database:
# - Connection pool usage
# - Query duration
# - Deadlocks
# - Table size growth
# - Index usage
#
# Cache (Redis):
# - Hit rate
# - Memory usage
# - Evictions
# - Connected clients
#
# Infrastructure:
# - CPU usage per pod
# - Memory usage per pod
# - Disk I/O
# - Network traffic
# - Pod restarts
#
# =============================================================================
