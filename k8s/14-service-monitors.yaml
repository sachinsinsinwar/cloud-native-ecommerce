# =============================================================================
# SERVICE MONITORS FOR E-COMMERCE APPLICATION
# =============================================================================
#
# ServiceMonitor is a custom resource from Prometheus Operator
# For manual Prometheus setup, these need annotations on services/pods
#
# This file provides:
# - Annotations for backend services to expose metrics
# - Example metrics endpoints
# - Instructions for adding Prometheus client libraries
#
# =============================================================================

# =============================================================================
# IMPORTANT: Add these annotations to your existing services
# =============================================================================
#
# Backend service (04-backend-deployment.yaml):
# Add to pod template metadata.annotations:
#   prometheus.io/scrape: "true"
#   prometheus.io/port: "5000"
#   prometheus.io/path: "/metrics"
#
# Frontend service (05-frontend-deployment.yaml):
#   prometheus.io/scrape: "true"
#   prometheus.io/port: "80"
#   prometheus.io/path: "/metrics"
#
# =============================================================================

