# =============================================================================
# FRONTEND (REACT/NGINX) DEPLOYMENT AND SERVICE
# =============================================================================
# Why Deployment?
# - Static files served by nginx (stateless)
# - Easy scaling for high traffic
# - Rolling updates for new frontend versions
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ecommerce
  labels:
    app: frontend
spec:
  # LoadBalancer - exposes frontend to internet
  # In cloud providers (AWS/GCP/Azure), this creates an external load balancer
  # For local testing, use NodePort or Ingress instead
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  # Session affinity (optional)
  sessionAffinity: None

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ecommerce
  labels:
    app: frontend
spec:
  # Horizontal scaling
  replicas: 3
  
  # Deployment strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
      
  selector:
    matchLabels:
      app: frontend
      
  template:
    metadata:
      labels:
        app: frontend
        version: v1
    spec:
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 101  # nginx user
        fsGroup: 101
        
      containers:
      - name: frontend
        # Pulls image from Docker Hub
        image: sachinsingh20/ecommerce-frontend:latest
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        imagePullPolicy: Always
        
        # Resource limits
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "150m"
            
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
          
        # Environment variable for API URL
        # This is baked into the build, but can be overridden
        env:
        - name: VITE_API_URL
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: VITE_API_URL
              
        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
          
        # Readiness probe
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          
      restartPolicy: Always
      terminationGracePeriodSeconds: 20

---

# =============================================================================
# FRONTEND HORIZONTAL POD AUTOSCALER
# =============================================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: ecommerce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---

# =============================================================================
# FRONTEND POD DISRUPTION BUDGET
# =============================================================================

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: ecommerce
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend


