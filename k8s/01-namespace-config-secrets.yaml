# =============================================================================
# NAMESPACE - Logical isolation for the e-commerce application
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce
  labels:
    app: ecommerce
    environment: production
    
---

# =============================================================================
# CONFIGMAP - Non-sensitive configuration data
# =============================================================================
# Why ConfigMap?
# - Separates configuration from application code
# - Easy to update without rebuilding images
# - Can be mounted as files or environment variables
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
  labels:
    app: ecommerce
data:
  # Flask Configuration
  FLASK_ENV: "production"
  FLASK_APP: "app.py"
  
  # Database Configuration (non-sensitive)
  POSTGRES_DB: "ecommerce_db"
  POSTGRES_PORT: "5432"
  
  # Redis Configuration
  REDIS_PORT: "6379"
  
  # Application Settings
  PRODUCTS_PER_PAGE: "20"
  CACHE_DEFAULT_TIMEOUT: "300"
  
  # CORS Settings - Update for production domain
  CORS_ORIGINS: "https://ecommerce.sachininfo.xyz"
  
  # Backend URL for frontend
  VITE_API_URL: "https://ecommerceapi.sachininfo.xyz"

---

# =============================================================================
# SECRETS - Sensitive data (passwords, tokens, keys)
# =============================================================================
# Why Secrets?
# - Encrypted at rest in etcd
# - Not visible in pod specs
# - Can be rotated without code changes
# 
# IMPORTANT: These are base64 encoded examples. In production:
# - Use external secret management (AWS Secrets Manager, HashiCorp Vault)
# - Or generate strong passwords and encode them:
#   echo -n "your-password" | base64
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
  labels:
    app: ecommerce
type: Opaque
data:
  # PostgreSQL password (base64 encoded)
  # Example: echo -n "change-this-password" | base64
  POSTGRES_PASSWORD: Y2hhbmdlLXRoaXMtcGFzc3dvcmQ=
  
  # Redis password (base64 encoded)  
  # Example: echo -n "redis-secure-password" | base64
  REDIS_PASSWORD: cmVkaXMtc2VjdXJlLXBhc3N3b3Jk
  
  # Flask secret key for JWT signing (base64 encoded)
  # Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"
  SECRET_KEY: eW91ci1zdXBlci1zZWNyZXQta2V5LWNoYW5nZS10aGlzLWluLXByb2R1Y3Rpb24=

---

# =============================================================================
# POSTGRESQL USER CREDENTIALS SECRET
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: ecommerce
type: Opaque
data:
  # PostgreSQL username (base64 encoded)
  # Default: postgres
  POSTGRES_USER: cG9zdGdyZXM=
  
  # PostgreSQL password (base64 encoded)
  # CHANGE THIS IN PRODUCTION!
  POSTGRES_PASSWORD: Y2hhbmdlLXRoaXMtcGFzc3dvcmQ=
