
name: SecureOps Security Pipeline



on:

  push:

    branches: [main, staging]

  pull_request:

    branches: [main, staging]

  workflow_dispatch:



permissions:

  contents: read

  security-events: write



jobs:

  # Gate 1 - Secret scanning

  secret-scan:

    name: Secret scan (gitleaks)

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

        with:

          fetch-depth: 0

      - name: Run gitleaks

        uses: gitleaks/gitleaks-action@v2

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



  # Gate 2 - SAST

  sast:

    name: SAST (Semgrep)

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

        with:

          python-version: '3.12'

      - name: Install Semgrep

        run: python -m pip install --upgrade semgrep

      - name: Run Semgrep

        run: semgrep scan --config p/python --config p/javascript --config p/secrets --config p/owasp-top-ten --sarif --output semgrep.sarif --error

      - name: Upload findings to Security tab

        if: always()

        uses: github/codeql-action/upload-sarif@v3

        with:

          sarif_file: semgrep.sarif



  # Gate 3 - SCA (file scan)

  sca:

    name: SCA (Trivy filesystem)

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Trivy dependency scan

        uses: aquasecurity/trivy-action@master

        with:

          scan-type: fs

          scan-ref: .

          scanners: vuln

          severity: HIGH,CRITICAL

          exit-code: '1'

          format: table



  # Build - only runs if all three scans above pass

  build:

    name: Build and push images

    runs-on: ubuntu-latest

    needs: [secret-scan, sast, sca]

    permissions:

      contents: read

      packages: write

    steps:

      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry

        uses: docker/login-action@v3

        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx

        uses: docker/setup-buildx-action@v3

      - name: Build and push backend

        uses: docker/build-push-action@v6

        with:

          context: ./backend

          push: true

          tags: |

            ghcr.io/sachinsinsinwar/ecommerce-backend:${{ github.sha }}

            ghcr.io/sachinsinsinwar/ecommerce-backend:latest

      - name: Build and push frontend

        uses: docker/build-push-action@v6

        with:

          context: ./frontend

          push: true

          build-args: |

            VITE_API_URL=https://ecommerceapi.sachininfo.xyz

          tags: |

            ghcr.io/sachinsinsinwar/ecommerce-frontend:${{ github.sha }}

            ghcr.io/sachinsinsinwar/ecommerce-frontend:latest



  # Image scan - scans the whole built container, base OS included

  image-scan:

    name: Image scan (Trivy)

    runs-on: ubuntu-latest

    needs: build

    permissions:

      contents: read

      packages: read

    steps:

      - name: Log in to GitHub Container Registry

        uses: docker/login-action@v3

        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan backend image

        uses: aquasecurity/trivy-action@master

        with:

          scan-type: image

          image-ref: ghcr.io/sachinsinsinwar/ecommerce-backend:${{ github.sha }}

          scanners: vuln

          severity: HIGH,CRITICAL

          ignore-unfixed: true

          exit-code: '1'

          format: table

      - name: Scan frontend image

        uses: aquasecurity/trivy-action@master

        with:

          scan-type: image

          image-ref: ghcr.io/sachinsinsinwar/ecommerce-frontend:${{ github.sha }}

          scanners: vuln

          severity: HIGH,CRITICAL

          ignore-unfixed: true

          exit-code: '1'

          format: table



  # Colourful summary on the run page

  summary:

    name: Pipeline summary

    runs-on: ubuntu-latest

    needs: [secret-scan, sast, sca, build, image-scan]

    if: always()

    steps:

      - name: Write colourful summary

        run: |

          icon() { case "$1" in success) echo "white_check_mark";; failure) echo "x";; skipped) echo "next_track_button";; *) echo "white_large_square";; esac; }

          {

            echo "# SecureOps Security Pipeline"

            echo ""

            echo "Commit \`${GITHUB_SHA:0:7}\` on branch \`${GITHUB_REF_NAME}\`"

            echo ""

            echo "```mermaid"

            echo "flowchart LR"

            echo "  A([Push]):::src --> B[Secret scan]:::scan"

            echo "  B --> C[SAST]:::scan"

            echo "  C --> D[SCA]:::scan"

            echo "  D --> E[Build image]:::build"

            echo "  E --> F[Image scan]:::build"

            echo "  F --> G[Sign and SBOM]:::next"

            echo "  G --> H[DAST]:::next"

            echo "  H --> I[Deploy]:::next"

            echo "  classDef src fill:#dfe1e6,stroke:#6b7280,color:#1f2937"

            echo "  classDef scan fill:#bfe3ff,stroke:#1d6fb8,color:#0a3a61"

            echo "  classDef build fill:#cdc9f7,stroke:#5b50c0,color:#272160"

            echo "  classDef next fill:#eceae3,stroke:#9a988f,color:#54534d"

            echo "```"

            echo ""

            echo "## This run"

            echo "| Stage | Result |"

            echo "| :-- | :-- |"

            echo "| Secret scan | :$(icon ${{ needs.secret-scan.result }}): ${{ needs.secret-scan.result }} |"

            echo "| SAST | :$(icon ${{ needs.sast.result }}): ${{ needs.sast.result }} |"

            echo "| SCA | :$(icon ${{ needs.sca.result }}): ${{ needs.sca.result }} |"

            echo "| Build | :$(icon ${{ needs.build.result }}): ${{ needs.build.result }} |"

            echo "| Image scan | :$(icon ${{ needs.image-scan.result }}): ${{ needs.image-scan.result }} |"

          } >> "$GITHUB_STEP_SUMMARY"

