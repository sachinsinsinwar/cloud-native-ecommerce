
name: SecureOps Security Pipeline



on:

  push:

    branches: [main, staging]

  pull_request:

    branches: [main, staging]

  workflow_dispatch:



permissions:

  contents: read

  security-events: write



jobs:

  # Gate 1 - Secret scanning: catches committed credentials first

  secret-scan:

    name: Secret scan (gitleaks)

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

        with:

          fetch-depth: 0

      - name: Run gitleaks

        uses: gitleaks/gitleaks-action@v2

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



  # Gate 2 - SAST: static analysis of source code (single-line command on purpose)

  sast:

    name: SAST (Semgrep)

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

        with:

          python-version: '3.12'

      - name: Install Semgrep

        run: python -m pip install --upgrade semgrep

      - name: Run Semgrep

        run: semgrep scan --config p/python --config p/javascript --config p/secrets --config p/owasp-top-ten --sarif --output semgrep.sarif --error

      - name: Upload findings to Security tab

        if: always()

        uses: github/codeql-action/upload-sarif@v3

        with:

          sarif_file: semgrep.sarif



  # Gate 3 - SCA: scans dependencies for known CVEs

  sca:

    name: SCA (Trivy filesystem)

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Trivy dependency scan

        uses: aquasecurity/trivy-action@master

        with:

          scan-type: fs

          scan-ref: .

          scanners: vuln

          severity: HIGH,CRITICAL

          exit-code: '1'

          format: table

